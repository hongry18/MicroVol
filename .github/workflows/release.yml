name: Release MicroVol

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MicroVol.app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package zip
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent MicroVol.app ../MicroVol-arm64.zip
          shasum -a 256 ../MicroVol-arm64.zip > ../MicroVol-arm64.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MicroVol-arm64.zip
            MicroVol-arm64.zip.sha256
          generate_release_notes: true
